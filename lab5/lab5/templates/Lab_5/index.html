{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 5 — Między stronami — katalog książek</title>
    <link rel="stylesheet" href="{% static 'Lab_5/style.css' %}">
    <script src="{% static 'Lab_5/app.js' %}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'Lab_5:index' %}">Między stronami</a>
        <a href="/admin/">Panel administratora</a>
    </header>
    <main>
        <section class="intro">
            <h1>Katalog książek</h1>
        </section>
        <section aria-label="Książki">
            <div class="toolbar">
                <form id="filters" class="controls">
                    <label for="available">Dostępność
                        <select id="available">
                            <option value="">Wszystkie książki</option>
                            <option value="true">Dostępne</option>
                            <option value="false">Wypożyczone</option>
                        </select>
                    </label>
                    <label for="genre">Gatunek
                        <select id="genre">
                            <option value="">Wszystkie gatunki</option>
                            {% for genre in genres %}<option value="{{ genre }}">{{ genre }}</option>{% endfor %}
                        </select>
                    </label>
                    <label for="min-rating">Ocena
                        <select id="min-rating">
                            <option value="">Wszystkie oceny</option>
                            <option value="5">5 / 5</option>
                            <option value="4">Od 4 / 5</option>
                            <option value="3">Od 3 / 5</option>
                            <option value="2">Od 2 / 5</option>
                            <option value="1">Od 1 / 5</option>
                        </select>
                    </label>
                    <label for="sort">Sortowanie
                        <select id="sort">
                            <option value="title">Tytuł A–Z</option>
                            <option value="-rating">Najwyżej oceniane</option>
                            <option value="-added_on">Ostatnio dodane</option>
                        </select>
                    </label>
                    <button id="load" type="submit" data-url="{% url 'Lab_5:books_api' %}">Wczytaj dane</button>
                </form>
            </div>
            <div class="results-bar">
                <p id="status" role="status" aria-live="polite">Ładowanie książek…</p>
                <a id="json-link" href="{% url 'Lab_5:books_api' %}" target="_blank" rel="noopener">Dane JSON</a>
            </div>
            <noscript>Włącz JavaScript, aby korzystać z filtrów. Dane możesz odczytać przez link JSON.</noscript>
            <div id="books" class="books" aria-busy="false"></div>
        </section>
    </main>
</body>
</html>
